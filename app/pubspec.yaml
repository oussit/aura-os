name: aura_os
description: "The World's Most Advanced AI Live Wallpaper App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  flutter_blur: ^1.0.0
  animated_text_kit: ^4.2.2
  lottie: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.0
  
  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  
  # Sensors & Device
  sensors_plus: ^4.0.2
  battery_plus: ^5.0.2
  connectivity_plus: ^5.0.2
  device_info_plus: ^10.0.1
  vibration: ^1.8.4
  
  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  
  # Image Processing
  image: ^4.1.3
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.1.0
  
  # AI & Generation
  http: ^1.2.0
  
  # Animations & Graphics
  vector_math: ^2.1.4
  flame: ^1.14.0
  flame_tiled: ^1.17.0
  
  # Firebase / Supabase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10
  
  # In-App Purchase
  purchases_flutter: ^6.6.0
  
  # Ads (AdMob)
  google_mobile_ads: ^5.1.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  fpdart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/lottie/
  
  fonts:
    - family: AuraSans
      fonts:
        - asset: assets/fonts/AuraSans-Light.ttf
        - asset: assets/fonts/AuraSans-Regular.ttf
        - asset: assets/fonts/AuraSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/AuraSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/AuraSans-Black.ttf
          weight: 900
