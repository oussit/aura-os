
version: "3.9"

services:
  # FastAPI Backend
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura:aura@postgres:5432/auraos
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
    depends_on:
      - postgres
      - redis
    volumes:
      - ../../backend:/app
    restart: unless-stopped

  # GPU Worker (Stable Diffusion / ComfyUI)
  gpu-worker:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.gpu
    ports:
      - "8001:8001"
    environment:
      - MODEL=stabilityai/stable-diffusion-xl-base-1.0
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auraos
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Celery Worker (background tasks)
  worker:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.api
    command: celery -A app.tasks.worker worker -l info -c 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura:aura@postgres:5432/auraos
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  model-cache:
